<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How ads-gate.js decides whether to serve AdSense</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
      .q{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.5}
      .on{fill:#ecfdf5;stroke:#10b981;stroke-width:2}
      .off{fill:#fef2f2;stroke:#ef4444;stroke-width:2}
      .t{font-size:15px;fill:#0f172a;font-weight:600}
      .s{font-size:12.5px;fill:#475569}
      .m{font-size:12px;fill:#334155;font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
      .l{font-size:12.5px;fill:#64748b;font-weight:600}
      .ln{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="880" height="520" fill="#ffffff"/>

  <!-- start -->
  <rect class="box" x="300" y="20" width="280" height="56" rx="10"/>
  <text class="t" x="440" y="44" text-anchor="middle">Page loads</text>
  <text class="s" x="440" y="63" text-anchor="middle">ads-gate.js runs before adsbygoogle.js</text>

  <!-- q1 -->
  <path class="ln" d="M440 76 V108"/>
  <rect class="q" x="200" y="110" width="480" height="70" rx="10"/>
  <text class="t" x="440" y="136" text-anchor="middle">Inside YOUR app's WebView?</text>
  <text class="m" x="440" y="157" text-anchor="middle">app_mode / ?app=1  AND  UA is a WebView</text>
  <text class="s" x="440" y="173" text-anchor="middle">(Android "; wv)" · iOS without "Safari/" · not Naver/Kakao/IG/FB…)</text>

  <!-- no -> serve -->
  <path class="ln" d="M200 145 H130 V420"/>
  <text class="l" x="165" y="137" text-anchor="middle">No</text>

  <!-- q2 -->
  <path class="ln" d="M440 180 V212"/>
  <text class="l" x="455" y="202">Yes</text>
  <rect class="q" x="250" y="214" width="380" height="88" rx="10"/>
  <text class="t" x="440" y="240" text-anchor="middle">Registered with the GMA SDK?</text>
  <text class="m" x="440" y="261" text-anchor="middle">Android: window.gmaSdk.getQueryInfo</text>
  <text class="m" x="440" y="278" text-anchor="middle">iOS: messageHandlers.getGmaQueryInfo / getGmaSig</text>
  <text class="s" x="440" y="295" text-anchor="middle">or remembered in localStorage from an earlier page</text>

  <!-- yes -> serve -->
  <path class="ln" d="M250 258 H180 V420"/>
  <text class="l" x="215" y="250" text-anchor="middle">Yes</text>

  <!-- no -> pause -->
  <path class="ln" d="M630 258 H740 V330"/>
  <text class="l" x="685" y="250" text-anchor="middle">No (old build)</text>

  <!-- pause box -->
  <rect class="off" x="600" y="332" width="260" height="96" rx="10"/>
  <text class="t" x="730" y="358" text-anchor="middle">Pause AdSense</text>
  <text class="m" x="730" y="380" text-anchor="middle">pauseAdRequests = 1</text>
  <text class="m" x="730" y="398" text-anchor="middle">html.ads-gate-off</text>
  <text class="s" x="730" y="416" text-anchor="middle">no unapproved requests</text>

  <!-- recheck -->
  <path class="ln" d="M600 400 C 520 400, 470 450, 330 452"/>
  <text class="s" x="350" y="492">re-check at 1.5s and 4s: signal appears → resume</text>

  <!-- serve box -->
  <rect class="on" x="40" y="422" width="290" height="78" rx="10"/>
  <text class="t" x="185" y="450" text-anchor="middle">Serve AdSense normally</text>
  <text class="s" x="185" y="470" text-anchor="middle">browsers · other apps' in-app browsers</text>
  <text class="s" x="185" y="487" text-anchor="middle">· updated (registered) app builds</text>
</svg>
